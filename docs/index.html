<style>
  :root {
    --felt: #14512b;
    --felt-deep: #0c3a1d;
    --felt-light: #1f6b3a;
    --cream: #f7f2e4;
    --ink: #1c1b17;
    --muted: #6c6a60;
    --format: #c8541f;
    --keeps: #2a5fb3;
    --gold: #e0b94a;
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--felt-light), var(--felt) 55%, var(--felt-deep));
    color: var(--cream);
    display: flex;
    flex-direction: column;
    min-height: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; cursor: pointer; border: 0; }

  #update {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: calc(10px + var(--safe-top)) 16px 10px;
    background: var(--gold); color: var(--ink);
    align-items: center; justify-content: space-between; gap: 12px;
    font-weight: 600;
  }
  #update.show { display: flex; }
  #update button { background: var(--ink); color: var(--cream); padding: 8px 14px; border-radius: 999px; font-weight: 700; }

  header {
    padding: calc(12px + var(--safe-top)) 16px 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 {
    margin: 0; font-size: 26px; letter-spacing: 0.18em; font-weight: 800;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .tools { display: flex; gap: 8px; }
  .tool {
    background: rgba(255,255,255,.12); color: var(--cream);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px;
  }
  .tool:active { background: rgba(255,255,255,.25); }
  #install { display: none; }
  #install.show { display: inline-block; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 16px; gap: 12px; min-height: 0;
  }
  .card {
    width: min(100%, 360px, calc(58vh * 5 / 7));
    aspect-ratio: 5 / 7;
    background: var(--cream); color: var(--ink);
    border-radius: var(--radius);
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 6px var(--cream), inset 0 0 0 8px rgba(0,0,0,.08);
    padding: 26px 24px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    transform-origin: 50% 60%;
  }
  .card.empty { align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 18px; }
  .card.deal { animation: deal .38s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes deal {
    from { transform: translateY(40px) rotate(-4deg) scale(.92); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .card .pile {
    font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
  }
  .card.format .pile { color: var(--format); }
  .card.keeps .pile { color: var(--keeps); }
  .card h2 { margin: 10px 0 14px; font-size: 32px; line-height: 1.05; }
  .card.format h2 { padding-right: 56px; }
  .card .body { font-size: 18px; line-height: 1.4; overflow: auto; }
  .card.long .body { font-size: 15px; line-height: 1.35; }
  .card.long h2 { font-size: 26px; }
  .card .body p { margin: 0 0 12px; }
  .card .body .label {
    font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 2px 0 4px;
  }
  .card .body ul { margin: 0 0 12px; padding-left: 18px; }
  .card .body li { margin: 0 0 4px; }
  .card .body ul.cols { columns: 2; column-gap: 10px; padding-left: 16px; font-size: .88em; line-height: 1.25; }
  .card .body ul.cols li { break-inside: avoid; margin-bottom: 2px; }
  .card .points {
    position: absolute; top: 18px; right: 18px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--format); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; line-height: 1;
  }
  .card .points.wide { font-size: 17px; }
  .card .points small { font-size: 9px; letter-spacing: .1em; font-weight: 700; }
  .card .format {
    display: inline-block; margin: -6px 0 12px; padding: 3px 9px; border-radius: 6px;
    background: rgba(200,84,31,.12); color: var(--format);
    font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  }
  .card.xlong .body { font-size: 13.5px; line-height: 1.3; }
  .card.xlong .body p, .card.xlong .body ul { margin-bottom: 8px; }
  .card.xlong h2 { font-size: 22px; margin-bottom: 10px; }
  .card .foot { margin-top: auto; font-size: 12px; color: var(--muted); }
  .card.played::after {
    content: 'PLAYED';
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(-18deg);
    padding: 8px 22px; border: 5px solid var(--format); border-radius: 10px;
    color: var(--format); font-size: 44px; font-weight: 900; letter-spacing: .12em;
    opacity: .82; pointer-events: none;
    animation: stamp .25s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes stamp { from { transform: translate(-50%, -50%) rotate(-18deg) scale(2); opacity: 0; } }

  .actions { display: flex; gap: 10px; width: min(100%, 360px); min-height: 48px; }
  .actions:empty { display: none; }
  .act {
    flex: 1; padding: 13px 12px; border-radius: 14px; font-weight: 800; font-size: 17px;
    background: rgba(255,255,255,.14); color: var(--cream);
  }
  .act.primary { background: var(--gold); color: var(--ink); }
  .act.danger { background: var(--format); color: #fff; }
  .act:active { filter: brightness(.9); }

  .hand { padding: 6px 0 2px; }
  .hand.empty { display: none; }
  .hand .title {
    padding: 0 16px 6px; font-size: 11px; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; opacity: .7;
  }
  .hand .strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px;
    scrollbar-width: none;
  }
  .hand .strip::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; background: var(--keeps); color: #fff;
    padding: 9px 13px; border-radius: 12px; font-weight: 700; font-size: 13px;
    box-shadow: 0 3px 0 rgba(0,0,0,.3); max-width: 60vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.on { outline: 3px solid var(--gold); outline-offset: 1px; }
  .chip.played { background: #6b6b66; text-decoration: line-through; }
  .chip.played::after {
    content: 'PLAYED'; margin-left: 8px; font-size: 9px; letter-spacing: .12em;
    text-decoration: none; color: var(--format); background: #fff; padding: 2px 5px; border-radius: 4px;
    display: inline-block; vertical-align: 1px;
  }

  footer { padding: 4px 16px calc(14px + var(--safe-bottom)); }
  .piles { display: flex; gap: 12px; }
  .draw {
    flex: 1; padding: 16px 12px; border-radius: var(--radius);
    color: #fff; font-weight: 800; font-size: 20px; letter-spacing: .02em;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .draw:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .draw small { font-size: 12px; font-weight: 600; opacity: .85; }
  .draw.format { background: var(--format); }
  .draw.keeps { background: var(--keeps); }
  .status { margin-top: 10px; text-align: center; font-size: 12px; opacity: .6; }
</style>
</head>
<body>

<div id="update" role="status">
  <span>A new version of FORE is ready.</span>
  <button id="reload" type="button">Reload</button>
</div>

<header>
  <h1>FORE</h1>
  <div class="tools">
    <button id="install" class="tool" type="button">Install</button>
    <button id="shuffle" class="tool" type="button">New Round</button>
  </div>
</header>

<main>
  <div id="card" class="card empty">Draw a Fore-Mat card to start the hole.</div>
  <div id="actions" class="actions"></div>
</main>

<div id="hand" class="hand empty">
  <div class="title">Your hand · <span id="hand-count"></span></div>
  <div id="strip" class="strip"></div>
</div>

<footer>
  <div class="piles">
    <button id="draw-format" class="draw format" type="button">Fore-Mat<small id="count-format"></small></button>
    <button id="draw-keeps" class="draw keeps" type="button">Power Up<small id="count-keeps"></small></button>
  </div>
  <div class="status"><span id="version"></span> · <span id="offline">checking offline support</span></div>
</footer>

xt":"Place a tee or divot repair tool on the green between an opponent's ball and the hole."},{"type":"list","label":"Restrictions","items":["The obstacle must be at least 1 foot away from the opponent's ball.","The obstacle must be at least 1 foot away from the hole."]}]},{"id":"keeps:putt-pass","pile":"keeps","title":"Putt Pass!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Hit a putt, then hit the ball one additional time while it is still moving."},{"type":"list","label":"Partner Rule","items":["If playing with a partner, you may instead pass the moving ball to your partner and let them hit it."]}]},{"id":"keeps:re-do","pile":"keeps","title":"Re-Do!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Give this card to another player immediately after they hit a shot."},{"type":"p","text":"They must replay the shot. Basically a reverse Mulligan."}]},{"id":"keeps:tee-up","pile":"keeps","title":"Tee Up!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Tee your ball up from anywhere for your next shot."}]},{"id":"keeps:cut-the-putt","pile":"keeps","title":"Cut The Putt!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Cut the distance of any putt in half."},{"type":"p","text":"Move the ball halfway closer to the hole before putting."}]},{"id":"keeps:free-drop","pile":"keeps","title":"Free Drop!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Take a free drop from a hazard or out-of-bounds area."}]},{"id":"keeps:auto-fairway","pile":"keeps","title":"Auto Fairway!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Move your tee shot to the closest point on the fairway."}]},{"id":"keeps:lip-out","pile":"keeps","title":"Lip Out!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"If your putt catches any part of the hole but does not go in, play this card and the putt counts as made."}]},{"id":"keeps:i-ll-have-what-he-s-having","pile":"keeps","title":"I'll Have What He's Having!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"If your drive is bad, move your ball to the location of another player's good drive."}]},{"id":"keeps:air-horn","pile":"keeps","title":"Air Horn!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Distract another player during their swing."}]},{"id":"keeps:bowl-putt","pile":"keeps","title":"Bowl Putt!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Roll the ball underhand toward the hole."},{"type":"list","label":"Restrictions","items":["Must be used from the green or fringe."]},{"type":"list","label":"Scoring","items":["The roll does not count as a stroke."]}]},{"id":"keeps:non-dominant-arm-throw","pile":"keeps","title":"Non-Dominant Arm Throw!","points":null,"format":null,"count":1,"body":[{"type":"p","text":"Advance your ball by throwing it with your non-dominant arm."},{"type":"list","label":"Restrictions","items":["Cannot be used once the ball is on the green."]},{"type":"list","label":"Scramble/Shamble Rule","items":["Does not count as a stroke.","You must use the card from your own ball.","After the throw, both partners may play from the resulting location."]}]}]</script>
<script>
(function () {
  'use strict';
  var VERSION = '0.1.12';
  var CARDS = JSON.parse(document.getElementById('cards-data').textContent);
  var BY_ID = {};
  CARDS.forEach(function (c) { BY_ID[c.id] = c; });
  var STORE_KEY = 'fore.deck.v2';
  var PILES = ['format', 'keeps'];

  var sounds = {
    draw: new Audio('sounds/draw.wav')
  };
  sounds.draw.preload = 'auto';
  function play(name) {
    var s = sounds[name];
    if (!s) return;
    try { s.currentTime = 0; var p = s.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }

  // State:
  //   format, keeps : draw piles (card ids, top of pile is the end)
  //   hole          : format card id in play for this hole, or null
  //   hand          : power up cards you are holding, { id, played }
  //                   played sticks to the card until it is discarded
  //   view          : what the big card shows
  //                   { type: 'hole' } | { type: 'hand', i: index }
  function shuffledPile(pile) {
    var ids = [];
    CARDS.forEach(function (c) {
      if (c.pile !== pile) return;
      for (var i = 0; i < c.count; i++) ids.push(c.id);
    });
    for (var j = ids.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = ids[j]; ids[j] = ids[k]; ids[k] = t;
    }
    return ids;
  }
  function freshState() {
    return { format: shuffledPile('format'), keeps: shuffledPile('keeps'), hole: null, hand: [], view: { type: 'hole' } };
  }
  function validIds(list, pile) {
    return Array.isArray(list) && list.every(function (id) { return BY_ID[id] && BY_ID[id].pile === pile; });
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!s) return null;
      if (!validIds(s.format, 'format') || !validIds(s.keeps, 'keeps') || !Array.isArray(s.hand)) return null;
      // Older saves stored the hand as bare ids. Upgrade them to { id, played }.
      s.hand = s.hand.map(function (h) { return typeof h === 'string' ? { id: h, played: false } : h; });
      if (!s.hand.every(function (h) { return h && BY_ID[h.id] && BY_ID[h.id].pile === 'keeps'; })) return null;
      if (s.hole && !(BY_ID[s.hole] && BY_ID[s.hole].pile === 'format')) s.hole = null;
      if (!s.view || (s.view.type === 'hand' && !(s.view.i >= 0 && s.view.i < s.hand.length))) s.view = { type: 'hole' };
      return s;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  var state = load() || freshState();

  var cardEl = document.getElementById('card');
  var actionsEl = document.getElementById('actions');
  var handEl = document.getElementById('hand');
  var stripEl = document.getElementById('strip');
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }
  function cardHtml(c) {
    var chars = 0;
    var body = '';
    c.body.forEach(function (b) {
      if (b.type === 'list') {
        if (b.label) { body += '<div class="label">' + esc(b.label) + '</div>'; chars += b.label.length; }
        // Many short items (like a list of formats) read better in two columns.
        var cols = b.items.length >= 6 && b.items.every(function (it) { return it.length <= 22; });
        body += cols ? '<ul class="cols">' : '<ul>';
        b.items.forEach(function (it) { body += '<li>' + esc(it) + '</li>'; chars += it.length; });
        body += '</ul>';
      } else {
        body += '<p>' + esc(b.text) + '</p>';
        chars += b.text.length;
      }
    });
    var html = '<div class="pile">' + (c.pile === 'format' ? 'Fore-Mat · this hole' : 'Power Up') + '</div>';
    if (c.points != null) {
      html += '<div class="points' + (String(c.points).length > 2 ? ' wide' : '') + '">' + esc(c.points) + '<small>PTS</small></div>';
    }
    html += '<h2>' + esc(c.title) + '</h2>';
    if (c.format) html += '<div class="format">' + esc(c.format) + '</div>';
    html += '<div class="body">' + body + '</div>';
    html += '<div class="foot">' + (c.pile === 'format' ? 'Expires at the end of this hole.' : 'One use. Play it when you want it.') + '</div>';
    return { html: html, long: chars > 220, xlong: chars > 420 };
  }
  function button(cls, label, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'act ' + cls;
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }
  function render(animate) {
    PILES.forEach(function (p) {
      document.getElementById('count-' + p).textContent = state[p].length + ' left';
    });

    // Hand strip
    handEl.classList.toggle('empty', state.hand.length === 0);
    document.getElementById('hand-count').textContent = state.hand.length + (state.hand.length === 1 ? ' card' : ' cards');
    stripEl.innerHTML = '';
    state.hand.forEach(function (h, i) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (state.view.type === 'hand' && state.view.i === i ? ' on' : '') + (h.played ? ' played' : '');
      chip.textContent = BY_ID[h.id].title;
      chip.addEventListener('click', function () { showHand(i); });
      stripEl.appendChild(chip);
    });

    // Big card and its action buttons
    actionsEl.innerHTML = '';
    cardEl.classList.remove('deal');
    var c = null, cls = '';
    if (state.view.type === 'hand') {
      var h = state.hand[state.view.i];
      c = BY_ID[h.id];
      actionsEl.appendChild(button('', 'Back', showHole));
      if (h.played) {
        cls = ' played';
        actionsEl.appendChild(button('danger', 'Discard', discardPlayed));
      } else {
        actionsEl.appendChild(button('primary', 'Play', playCard));
      }
    } else if (state.hole) {
      c = BY_ID[state.hole];
    }
    if (!c) {
      cardEl.className = 'card empty';
      cardEl.textContent = 'Draw a Fore-Mat card to start the hole.';
    } else {
      var r = cardHtml(c);
      cardEl.className = 'card ' + c.pile + (r.xlong ? ' long xlong' : r.long ? ' long' : '') + cls;
      cardEl.innerHTML = r.html;
    }
    if (animate) {
      void cardEl.offsetWidth;
      cardEl.classList.add('deal');
    }
    var on = stripEl.querySelector('.chip.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  function drawFormat() {
    if (!state.format.length) state.format = shuffledPile('format');
    state.hole = state.format.pop();
    state.view = { type: 'hole' };
    play('draw');
    save();
    render(true);
  }
  function drawPowerUp() {
    if (!state.keeps.length) state.keeps = shuffledPile('keeps');
    state.hand.push({ id: state.keeps.pop(), played: false });
    state.view = { type: 'hand', i: state.hand.length - 1 };
    play('draw');
    save();
    render(true);
  }
  function showHand(i) {
    state.view = { type: 'hand', i: i };
    save();
    render(true);
  }
  function showHole() {
    state.view = { type: 'hole' };
    save();
    render(false);
  }
  function playCard() {
    if (state.view.type !== 'hand') return;
    state.hand[state.view.i].played = true;
    save();
    render(false);
  }
  function discardPlayed() {
    if (state.view.type !== 'hand' || !state.hand[state.view.i].played) return;
    state.hand.splice(state.view.i, 1);
    state.view = { type: 'hole' };
    save();
    render(true);
  }
  function newRound() {
    if (state.hand.length && !confirm('Start a new round? This clears your hand and reshuffles both piles.')) return;
    state = freshState();
    save();
    render(true);
  }
  document.getElementById('draw-format').addEventListener('click', drawFormat);
  document.getElementById('draw-keeps').addEventListener('click', drawPowerUp);
  document.getElementById('shuffle').addEventListener('click', newRound);
  document.getElementById('version').textContent = 'v' + VERSION;
  render(false);

  // Install prompt (Android/desktop Chrome). iOS uses Share > Add to Home Screen.
  var installBtn = document.getElementById('install');
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; installBtn.classList.remove('show'); });
  });
  window.addEventListener('appinstalled', function () { installBtn.classList.remove('show'); });

  // Service worker and update banner.
  var offlineEl = document.getElementById('offline');
  function cmpVersion(a, b) {
    var x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (x[i] || 0) - (y[i] || 0);
      if (d) return d;
    }
    return 0;
  }
  if ('serviceWorker' in navigator) {
    var sw = navigator.serviceWorker;
    var askVersion = function () {
      if (sw.controller) {
        sw.controller.postMessage({ type: 'version' });
        sw.controller.postMessage({ type: 'precache' });
        offlineEl.textContent = 'works offline';
      } else {
        offlineEl.textContent = 'caching for offline';
      }
    };
    sw.addEventListener('message', function (e) {
      var d = e.data || {};
      // Only banner when the worker is NEWER than this page. A worker that is
      // older than the page is about to be replaced and would false-alarm.
      if (d.type === 'version' && cmpVersion(d.version, VERSION) > 0) {
        document.getElementById('update').classList.add('show');
      }
    });
    sw.addEventListener('controllerchange', askVersion);
    sw.register('sw.js').then(function (reg) {
      askVersion();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {
      offlineEl.textContent = 'offline support unavailable';
    });
  } else {
    offlineEl.textContent = 'offline support unavailable';
  }
  document.getElementById('reload').addEventListener('click', function () { location.reload(); });
})();
</script>
</body>
</html>
