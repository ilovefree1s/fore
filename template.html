<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORE</title>
<meta name="description" content="FORE: a golf card game. Draw a format card for the hole, hold keeps cards for later.">
<meta name="theme-color" content="#14512b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<!--FAVICON-->
<style>
  :root {
    --felt: #14512b;
    --felt-deep: #0c3a1d;
    --felt-light: #1f6b3a;
    --cream: #f7f2e4;
    --ink: #1c1b17;
    --muted: #6c6a60;
    --format: #c8541f;
    --keeps: #2a5fb3;
    --gold: #e0b94a;
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--felt-light), var(--felt) 55%, var(--felt-deep));
    color: var(--cream);
    display: flex;
    flex-direction: column;
    min-height: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; cursor: pointer; border: 0; }

  #update {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: calc(10px + var(--safe-top)) 16px 10px;
    background: var(--gold); color: var(--ink);
    align-items: center; justify-content: space-between; gap: 12px;
    font-weight: 600;
  }
  #update.show { display: flex; }
  #update button { background: var(--ink); color: var(--cream); padding: 8px 14px; border-radius: 999px; font-weight: 700; }

  header {
    padding: calc(12px + var(--safe-top)) 16px 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 {
    margin: 0; font-size: 26px; letter-spacing: 0.18em; font-weight: 800;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .tools { display: flex; gap: 8px; }
  .tool {
    background: rgba(255,255,255,.12); color: var(--cream);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px;
  }
  .tool:active { background: rgba(255,255,255,.25); }
  #install { display: none; }
  #install.show { display: inline-block; }

  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 8px 16px;
  }
  .card {
    width: min(100%, 360px);
    aspect-ratio: 5 / 7;
    max-height: 70vh;
    background: var(--cream); color: var(--ink);
    border-radius: var(--radius);
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 6px var(--cream), inset 0 0 0 8px rgba(0,0,0,.08);
    padding: 26px 24px;
    display: flex; flex-direction: column;
    position: relative;
    transform-origin: 50% 60%;
  }
  .card.empty { align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 18px; }
  .card.deal { animation: deal .38s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes deal {
    from { transform: translateY(40px) rotate(-4deg) scale(.92); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .card .pile {
    font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
  }
  .card.format .pile { color: var(--format); }
  .card.keeps .pile { color: var(--keeps); }
  .card h2 { margin: 10px 0 14px; font-size: 32px; line-height: 1.05; padding-right: 56px; }
  .card .body { font-size: 18px; line-height: 1.4; overflow: auto; }
  .card .body p { margin: 0 0 12px; }
  .card .points {
    position: absolute; top: 18px; right: 18px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--format); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; line-height: 1;
  }
  .card .points small { font-size: 9px; letter-spacing: .1em; font-weight: 700; }
  .card .foot { margin-top: auto; font-size: 12px; color: var(--muted); }

  footer {
    padding: 8px 16px calc(16px + var(--safe-bottom));
  }
  .piles { display: flex; gap: 12px; }
  .draw {
    flex: 1; padding: 18px 12px; border-radius: var(--radius);
    color: #fff; font-weight: 800; font-size: 20px; letter-spacing: .02em;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .draw:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .draw small { font-size: 12px; font-weight: 600; opacity: .85; }
  .draw.format { background: var(--format); }
  .draw.keeps { background: var(--keeps); }
  .status {
    margin-top: 12px; text-align: center; font-size: 12px; opacity: .6;
  }
</style>
</head>
<body>

<div id="update" role="status">
  <span>A new version of FORE is ready.</span>
  <button id="reload" type="button">Reload</button>
</div>

<header>
  <h1>FORE</h1>
  <div class="tools">
    <button id="install" class="tool" type="button">Install</button>
    <button id="shuffle" class="tool" type="button">Shuffle</button>
  </div>
</header>

<main>
  <div id="card" class="card empty">Tap a pile to draw.</div>
</main>

<footer>
  <div class="piles">
    <button id="draw-format" class="draw format" type="button">Format<small id="count-format"></small></button>
    <button id="draw-keeps" class="draw keeps" type="button">Keep<small id="count-keeps"></small></button>
  </div>
  <div class="status"><span id="version"></span> · <span id="offline">checking offline support</span></div>
</footer>

<!--CARDS-->
<script>
(function () {
  'use strict';
  var VERSION = '<!--VERSION-->';
  var CARDS = JSON.parse(document.getElementById('cards-data').textContent);
  var BY_ID = {};
  CARDS.forEach(function (c) { BY_ID[c.id] = c; });
  var STORE_KEY = 'fore.deck.v1';
  var PILES = ['format', 'keeps'];

  var sounds = {
    draw: new Audio('sounds/draw.wav'),
    shuffle: new Audio('sounds/shuffle.wav')
  };
  sounds.draw.preload = 'auto';
  sounds.shuffle.preload = 'auto';
  function play(name) {
    var s = sounds[name];
    try { s.currentTime = 0; var p = s.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }

  function shuffledPile(pile) {
    var ids = [];
    CARDS.forEach(function (c) {
      if (c.pile !== pile) return;
      for (var i = 0; i < c.count; i++) ids.push(c.id);
    });
    for (var j = ids.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = ids[j]; ids[j] = ids[k]; ids[k] = t;
    }
    return ids;
  }
  function freshState() {
    return { format: shuffledPile('format'), keeps: shuffledPile('keeps'), current: null };
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!s) return null;
      var ok = PILES.every(function (p) {
        return Array.isArray(s[p]) && s[p].every(function (id) { return BY_ID[id] && BY_ID[id].pile === p; });
      });
      if (!ok) return null;
      if (s.current && !BY_ID[s.current.id]) s.current = null;
      return s;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  var state = load() || freshState();

  var cardEl = document.getElementById('card');
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }
  function render(animate) {
    PILES.forEach(function (p) {
      document.getElementById('count-' + p).textContent = state[p].length + ' left';
    });
    var cur = state.current;
    cardEl.classList.remove('deal');
    if (!cur) {
      cardEl.className = 'card empty';
      cardEl.textContent = 'Tap a pile to draw.';
      return;
    }
    var c = BY_ID[cur.id];
    cardEl.className = 'card ' + c.pile;
    var html = '<div class="pile">' + (c.pile === 'format' ? 'Format · this hole' : 'Keep · hold it') + '</div>';
    if (c.points != null) html += '<div class="points">' + c.points + '<small>PTS</small></div>';
    html += '<h2>' + esc(c.title) + '</h2><div class="body">';
    c.body.forEach(function (p) { html += '<p>' + esc(p) + '</p>'; });
    html += '</div><div class="foot">' + (c.pile === 'format' ? 'Expires at the end of this hole.' : 'Yours until you spend it.') + '</div>';
    cardEl.innerHTML = html;
    if (animate) {
      void cardEl.offsetWidth;
      cardEl.classList.add('deal');
    }
  }
  function draw(pile) {
    if (!state[pile].length) {
      state[pile] = shuffledPile(pile);
      play('shuffle');
    } else {
      play('draw');
    }
    state.current = { pile: pile, id: state[pile].pop() };
    save();
    render(true);
  }
  function shuffleAll() {
    state = freshState();
    play('shuffle');
    save();
    render(false);
  }
  document.getElementById('draw-format').addEventListener('click', function () { draw('format'); });
  document.getElementById('draw-keeps').addEventListener('click', function () { draw('keeps'); });
  document.getElementById('shuffle').addEventListener('click', shuffleAll);
  document.getElementById('version').textContent = 'v' + VERSION;
  render(false);

  // Install prompt (Android/desktop Chrome). iOS uses Share > Add to Home Screen.
  var installBtn = document.getElementById('install');
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; installBtn.classList.remove('show'); });
  });
  window.addEventListener('appinstalled', function () { installBtn.classList.remove('show'); });

  // Service worker and update banner.
  var offlineEl = document.getElementById('offline');
  function cmpVersion(a, b) {
    var x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (x[i] || 0) - (y[i] || 0);
      if (d) return d;
    }
    return 0;
  }
  if ('serviceWorker' in navigator) {
    var sw = navigator.serviceWorker;
    var askVersion = function () {
      if (sw.controller) {
        sw.controller.postMessage({ type: 'version' });
        sw.controller.postMessage({ type: 'precache' });
        offlineEl.textContent = 'works offline';
      } else {
        offlineEl.textContent = 'caching for offline';
      }
    };
    sw.addEventListener('message', function (e) {
      var d = e.data || {};
      // Only banner when the worker is NEWER than this page. A worker that is
      // older than the page is about to be replaced and would false-alarm.
      if (d.type === 'version' && cmpVersion(d.version, VERSION) > 0) {
        document.getElementById('update').classList.add('show');
      }
    });
    sw.addEventListener('controllerchange', askVersion);
    sw.register('sw.js').then(function (reg) {
      askVersion();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {
      offlineEl.textContent = 'offline support unavailable';
    });
  } else {
    offlineEl.textContent = 'offline support unavailable';
  }
  document.getElementById('reload').addEventListener('click', function () { location.reload(); });
})();
</script>
</body>
</html>
